[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-penetration-hunter"
version = "4.0.0"
description = "Professional mission orchestration for authorized security testing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Panda1847" }]
keywords = ["penetration-testing", "red-team", "security-automation", "reconnaissance", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.0",
  "requests>=2.28",
  "pexpect>=4.8",
  "cryptography>=42.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["flask>=2.3", "flask-socketio>=5.3"]
ai = ["openai>=1.30.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Panda1847/oracle-penetration-hunter"
Documentation = "https://github.com/Panda1847/oracle-penetration-hunter/tree/main/docs"
Issues = "https://github.com/Panda1847/oracle-penetration-hunter/issues"

[project.scripts]
oracle = "oracle.cli.main:main"

[tool.setuptools.packages.find]
include = ["api*", "core*", "dashboard*", "export*", "memory*", "oracle*", "plugins*", "queuebus*", "security*", "storage*", "telemetry*", "web*", "workers*"]

[tool.setuptools.package-data]
oracle = ["data/*.json", "data/*.json.gz", "web/static/vendor/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
