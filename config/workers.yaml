workers:
  mode: local
  heartbeat_seconds: 30
  heartbeat_timeout_seconds: 45
  # Set ORACLE_WORKER_SECRET in the environment before starting workers/API.
  shared_secret: ""
  callback_host: 127.0.0.1
  callback_port: 0
  local_worker_id: local-node
  tls_enabled: false
  tls_ca_file: ""
  tls_certfile: ""
  tls_keyfile: ""
